name: $(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: buildId
    displayName: 'Build ID (leave empty to use latest)'
    type: string
    default: ''

variables:
  - name: Codeql.Enabled
    value: Great
resources:
  repositories:
     repository: self
      type: git
      ref: refs/heads/main
     repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
trigger: none
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      os: linux
      name: 1ES_JavaTooling_Pool
      image: 1ES_JavaTooling_Ubuntu-2004
    