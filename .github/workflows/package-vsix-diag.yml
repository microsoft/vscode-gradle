name: Package Diagnostic VSIX

on:
  push:
    branches:
      - wenyt/per-call-grpc-channel
  workflow_dispatch:

jobs:
  package-vsix:
    name: Package VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: extension/package-lock.json
          cache: npm

      - name: Checkout microsoft/build-server-for-gradle
        uses: actions/checkout@v4
        with:
          repository: microsoft/build-server-for-gradle
          path: extension/build-server-for-gradle

      - name: Build external jars
        run: ../gradlew buildJars
        working-directory: extension
        env:
          JAVA_HOME: ""
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Build bundled artifacts
        run: ./gradlew :extension:bundle
        env:
          JAVA_HOME: ""
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Set executable permission
        run: chmod +x extension/lib/gradle-server

      - name: Package VSIX
        run: npx @vscode/vsce@latest package -o vscode-gradle-3.17.3-pr1862-per-call-grpc.vsix
        working-directory: extension

      - name: Verify per-call gRPC probe is included
        run: |
          unzip -p extension/vscode-gradle-3.17.3-pr1862-per-call-grpc.vsix extension/dist/index.js | grep -q 'GetBuild: using per-call gRPC client'
          unzip -p extension/vscode-gradle-3.17.3-pr1862-per-call-grpc.vsix extension/dist/index.js | grep -q 'RunBuild: using per-call gRPC client'

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-gradle-3.17.3-pr1862-per-call-grpc
          path: extension/vscode-gradle-3.17.3-pr1862-per-call-grpc.vsix
          if-no-files-found: error
