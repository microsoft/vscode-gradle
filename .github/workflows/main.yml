name: Build & Publish
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-analyse:
    name: Build & Analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # required by sonarqube
      - name: Use Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Use Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache-dependency-path: extension/package-lock.json
          cache: npm
      - name: Cache npm cache directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Checkout microsoft/build-server-for-gradle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: microsoft/build-server-for-gradle
          path: extension/build-server-for-gradle
      - name: Build Jars
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/configure-gradle-wrapper.sh" \
            ../gradle/wrapper/gradle-wrapper.properties \
            ./build-server-for-gradle/gradle/wrapper/gradle-wrapper.properties
          bash "$GITHUB_WORKSPACE/.github/scripts/warm-gradle-wrapper.sh" \
            ../gradlew \
            ./build-server-for-gradle/gradlew
          ../gradlew buildJars
        working-directory: extension/
      - name: Lint
        uses: gradle/gradle-build-action@a8f75513eafdebd8141bd1cd4e30fcd194af8dfa # v2.12.0
        with:
          arguments: lint
      - name: Build & Analyse Gradle Server
        uses: gradle/gradle-build-action@a8f75513eafdebd8141bd1cd4e30fcd194af8dfa # v2.12.0
        with:
          arguments: build
        env:
          JAVA_HOME: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
      - name: Upload lib
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lib
          path: |
            extension/lib
            extension/dist
            extension/out

  # Although the gradle build can run in all environments, we use the Java
  # lib generated in the previous step for a better real-world test.
  test-extension:
    needs: [build-and-analyse]
    name: "Test Java ${{ matrix.java-version }} - Node ${{ matrix.node-version }} - ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20]
        java-version: ["21"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache-dependency-path: extension/package-lock.json
          cache: npm
      - name: Use Java ${{ matrix.java-version }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"
      - name: Configure Gradle wrapper downloads
        shell: pwsh
        run: |
          $properties = "gradle/wrapper/gradle-wrapper.properties"
          $content = Get-Content -Path $properties -Raw
          $content = $content -replace 'https\\://services\.gradle\.org/distributions/', 'https\://downloads.gradle.org/distributions/'
          $content = $content -replace 'https://services\.gradle\.org/distributions/', 'https://downloads.gradle.org/distributions/'
          if ($content -match '(?m)^networkTimeout=') {
            $content = $content -replace '(?m)^networkTimeout=.*$', 'networkTimeout=60000'
          } else {
            $content = $content.TrimEnd() + "`nnetworkTimeout=60000`n"
          }
          Set-Content -Path $properties -Value $content -NoNewline
      - name: Cache vscode
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            extension/.vscode-test
          key: ${{ runner.os }}-vscode-${{ hashFiles('**/vscode-version.ts') }}
          restore-keys: |
            ${{ runner.os }}-vscode-
      - name: Download lib
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lib
          path: extension/
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        if: matrix.os == 'ubuntu-latest'
      - name: Set permissions
        run: |
          chmod +x extension/lib/gradle-server
          unset npm_config_prefix
        if: matrix.os != 'windows-latest'
      - name: Test Gradle Language Server
        uses: gradle/gradle-build-action@a8f75513eafdebd8141bd1cd4e30fcd194af8dfa # v2.12.0
        with:
          arguments: gradle-language-server:test
        env:
          JAVA_HOME: ""
      - name: Prepare gradle-groovy-custom-build-file
        uses: gradle/gradle-build-action@a8f75513eafdebd8141bd1cd4e30fcd194af8dfa # v2.12.0
        with:
          arguments: build
          build-root-directory: extension/test-fixtures/gradle-groovy-custom-build-file
      - name: Prepare gradle-groovy-default-build-file
        uses: gradle/gradle-build-action@a8f75513eafdebd8141bd1cd4e30fcd194af8dfa # v2.12.0
        with:
          arguments: build
          build-root-directory: extension/test-fixtures/gradle-groovy-default-build-file
      - name: Prepare gradle-kotlin-default-build-file
        uses: gradle/gradle-build-action@a8f75513eafdebd8141bd1cd4e30fcd194af8dfa # v2.12.0
        with:
          arguments: build
          build-root-directory: extension/test-fixtures/gradle-kotlin-default-build-file
      - name: Install extension dependencies
        working-directory: extension/
        run: npm ci
      - name: Test extension
        uses: gradle/gradle-build-action@a8f75513eafdebd8141bd1cd4e30fcd194af8dfa # v2.12.0
        continue-on-error: true
        id: test
        with:
          arguments: testVsCode
        env:
          DISPLAY: ":99.0"
          CI: "true"
      - name: Retry test extension attempt 1
        uses: gradle/gradle-build-action@a8f75513eafdebd8141bd1cd4e30fcd194af8dfa # v2.12.0
        continue-on-error: true
        if: steps.test.outcome=='failure'
        id: retry1
        with:
          arguments: testVsCode
        env:
          DISPLAY: ":99.0"
          CI: "true"

      - name: Retry test extension attempt 2
        uses: gradle/gradle-build-action@a8f75513eafdebd8141bd1cd4e30fcd194af8dfa # v2.12.0
        continue-on-error: true
        if: steps.retry1.outcome=='failure'
        id: retry2
        with:
          arguments: testVsCode
        env:
          DISPLAY: ":99.0"
          CI: "true"
      - name: Set test extension status
        if: ${{ steps.test.outcome=='failure' && steps.retry1.outcome=='failure' && steps.retry2.outcome=='failure' }}
        run: |
          echo "Tests failed"
          exit 1
