name: Build & Publish
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-analyse:
    name: Build & Analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # required by sonarqube
      - name: Use Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Use Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache-dependency-path: extension/package-lock.json
          cache: npm
      - name: Cache npm cache directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Checkout microsoft/build-server-for-gradle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/build-server-for-gradle
          path: extension/build-server-for-gradle
      - name: Build Jars
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/configure-gradle-wrapper.sh" \
            ../gradle/wrapper/gradle-wrapper.properties \
            ./build-server-for-gradle/gradle/wrapper/gradle-wrapper.properties
          bash "$GITHUB_WORKSPACE/.github/scripts/warm-gradle-wrapper.sh" \
            ../gradlew \
            ./build-server-for-gradle/gradlew
          ../gradlew buildJars
        working-directory: extension/
      - name: Lint
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
        with:
          arguments: lint
      - name: Build & Analyse Gradle Server
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
        with:
          arguments: build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
      - name: Upload lib
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lib
          path: |
            extension/lib
            extension/dist
            extension/out
            extension/server

  # Although the gradle build can run in all environments, we use the Java
  # lib generated in the previous step for a better real-world test.
  test-extension:
    needs: [build-and-analyse]
    name: "Test Java ${{ matrix.java-version }} - Node ${{ matrix.node-version }} - ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20]
        java-version: ["25"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache-dependency-path: extension/package-lock.json
          cache: npm
      - name: Use Java ${{ matrix.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"
      - name: Configure Gradle wrapper downloads
        shell: pwsh
        run: |
          $properties = "gradle/wrapper/gradle-wrapper.properties"
          $content = Get-Content -Path $properties -Raw
          $content = $content -replace 'https\\://services\.gradle\.org/distributions/', 'https\://downloads.gradle.org/distributions/'
          $content = $content -replace 'https://services\.gradle\.org/distributions/', 'https://downloads.gradle.org/distributions/'
          if ($content -match '(?m)^networkTimeout=') {
            $content = $content -replace '(?m)^networkTimeout=.*$', 'networkTimeout=60000'
          } else {
            $content = $content.TrimEnd() + "`nnetworkTimeout=60000`n"
          }
          Set-Content -Path $properties -Value $content -NoNewline
      - name: Cache vscode
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            extension/.vscode-test
          key: ${{ runner.os }}-vscode-${{ hashFiles('**/vscode-version.ts') }}
          restore-keys: |
            ${{ runner.os }}-vscode-
      - name: Download lib
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lib
          path: extension/
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        if: matrix.os == 'ubuntu-latest'
      - name: Set permissions
        run: |
          chmod +x extension/lib/gradle-server
          unset npm_config_prefix
        if: matrix.os != 'windows-latest'
      - name: Test Gradle Language Server
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
        with:
          arguments: gradle-language-server:test
      - name: Prepare gradle-groovy-custom-build-file
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
        with:
          arguments: build
          build-root-directory: extension/test-fixtures/gradle-groovy-custom-build-file
      - name: Prepare gradle-groovy-default-build-file
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
        with:
          arguments: build
          build-root-directory: extension/test-fixtures/gradle-groovy-default-build-file
      - name: Prepare gradle-kotlin-default-build-file
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
        with:
          arguments: build
          build-root-directory: extension/test-fixtures/gradle-kotlin-default-build-file
      - name: Install extension dependencies
        working-directory: extension/
        run: npm ci
      - name: Test extension
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
        continue-on-error: true
        id: test
        with:
          arguments: testVsCode
        env:
          DISPLAY: ":99.0"
          CI: "true"
      - name: Retry test extension attempt 1
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
        continue-on-error: true
        if: steps.test.outcome=='failure'
        id: retry1
        with:
          arguments: testVsCode
        env:
          DISPLAY: ":99.0"
          CI: "true"

      - name: Retry test extension attempt 2
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
        continue-on-error: true
        if: steps.retry1.outcome=='failure'
        id: retry2
        with:
          arguments: testVsCode
        env:
          DISPLAY: ":99.0"
          CI: "true"
      - name: Set test extension status
        if: ${{ steps.test.outcome=='failure' && steps.retry1.outcome=='failure' && steps.retry2.outcome=='failure' }}
        run: |
          echo "Tests failed"
          exit 1

  test-java27-compatibility:
    needs: [build-and-analyse]
    name: "Gradle 9.8.1 / daemon Java ${{ matrix.daemon }} / toolchain Java 27"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        daemon: ["25", "27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache-dependency-path: extension/package-lock.json
          cache: npm
      - name: Install Java 27 toolchain
        id: jdk27
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "27"
          distribution: temurin
      - name: Install Java 25 service runtime
        id: jdk25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: temurin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lib
          path: extension/
      - name: Install extension dependencies
        working-directory: extension
        run: npm ci
      - name: Run live import, tasks, dependencies, tests and debugging
        working-directory: extension
        run: |
          chmod +x lib/gradle-server
          xvfb-run -a node out/test/runCompatibilityTests.js
        env:
          JDK25_HOME: ${{ steps.jdk25.outputs.path }}
          JDK27_HOME: ${{ steps.jdk27.outputs.path }}
          GRADLE_COMPATIBILITY_DAEMON: ${{ matrix.daemon }}
          CI: "true"
