# IssueLens runs the bridge-backed issue loop for new or reopened issues,
# human issue comments, and manual workflow dispatches.
# Repository-specific duplicate, labeling, and no-assignment guidance is
# configured in .github/issuelens.yml (with automatic assignment disabled via
# .github/issuelens/assignment.md).
# Action completion confirms the bridge job receipt, not individual triage writes.
#
# Required repository or organization configuration:
#   Secrets: ISSUELENS_BRIDGE_URL
#
# The workflow authenticates to the IssueLens bridge via GitHub Actions OIDC
# (id-token: write), and the hosted agent mints repository-scoped GitHub App
# tokens internally. This repository stores no App private key.
# The App must be installed on this target repository for labels and comments.
# Related public repositories can be searched read-only without an App
# installation.

name: IssueLens issue triage

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to triage'
        required: true
        type: string

permissions: {}

concurrency:
  group: issuelens-${{ github.repository }}-issue-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      ${{ github.repository == 'microsoft/vscode-gradle' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          github.ref_protected &&
          (github.event_name != 'issue_comment' ||
           (github.event.issue.pull_request == null &&
            github.event.sender.type == 'User' &&
            github.event.comment.user.type == 'User')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      issues: read
      id-token: write
    steps:
      - name: Run IssueLens issue loop
        uses: microsoft/IssueLens/.github/actions/issuelens@61a9e9a5ff2f9514a3bdd351a0721235cd0a2813
        with:
          request-type: issue-loop
          transport: bridge
          issue-number: ${{ inputs.issue_number || github.event.issue.number }}
          bridge-url: ${{ secrets.ISSUELENS_BRIDGE_URL }}
          output-mode: activity
          summary-mode: status
