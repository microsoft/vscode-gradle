# IssueLens labels new issues and publishes its triage analysis as a bot comment.
# Repository-specific labeling guidance is configured in .github/issuelens.yml.
# A direct task preserves the explicit no-assignment/no-closing triage contract.
# Action completion confirms the response stream, not successful triage writes.
#
# Required repository or organization configuration:
#   Secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#            ISSUELENS_AGENT_URL, ISSUELENS_AGENT_SCOPE
#
# The hosted agent owns its Key Vault-backed GitHub App identity and mints
# repository-scoped tokens internally. This repository stores no App private key.
# The App must be installed on this target repository for labels and comments.
# Related public repositories can be searched read-only without an App
# installation. Agent endpoint access uses Azure OIDC.

name: IssueLens issue triage

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: string

run-name: >-
  IssueLens triage for #${{ github.event.issue.number || inputs.issue_number }}

permissions: {}

concurrency:
  group: issuelens-triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate issue number
        shell: bash
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail

          if ! [[ "$ISSUE" =~ ^[1-9][0-9]*$ ]]; then
            echo "Issue number must be a positive integer." >&2
            exit 1
          fi

      - name: Invoke IssueLens agent
        uses: microsoft/IssueLens/.github/actions/issuelens@532d3f7934f394d817402b46c90cb36388a12e02
        with:
          request-type: task
          input: >-
            Triage GitHub issue ${{ github.repository }}#${{ github.event.issue.number || inputs.issue_number }}.
            Find duplicates and related issues using the repository's configured scope,
            analyze the likely component and root cause, and apply appropriate existing labels.
            Do not assign or close the issue.
            Post one helpful comment to the reporter with your findings and practical next steps.
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          agent-url: ${{ secrets.ISSUELENS_AGENT_URL }}
          agent-scope: ${{ secrets.ISSUELENS_AGENT_SCOPE }}
          output-mode: activity
          summary-mode: status
