plugins {
  id 'java'
  id 'com.google.protobuf' version '0.8.13'
  id 'com.github.jlouns.cpe' version '0.5.0'
  alias(libs.plugins.spotless)
}

project.ext.set('protobufVersion', '3.25.5')
// protoc compiler stays at 3.12.0 because the extension subproject uses
// the built-in --js_out, which was removed in protoc 3.21+.
// The runtime library is forced to 3.25.5 via resolutionStrategy below.
project.ext.set('protocVersion', '3.12.0')
project.ext.set('toolingAPIVersion', '9.2.0')

allprojects {
  group = 'vscode-gradle'
}

subprojects {
  apply plugin: 'java'
  apply plugin: 'com.google.protobuf'
  apply plugin: 'com.diffplug.spotless'

  repositories {
    mavenCentral()
    mavenLocal()
    maven {
      url 'https://maven-central.storage-download.googleapis.com/repos/central/data/'
    }
    maven {
      url 'https://repo.gradle.org/gradle/libs-releases'
    }
  }

  configurations.all {
    resolutionStrategy {
      force "com.google.protobuf:protobuf-java:${protobufVersion}"
    }
  }

  protobuf {
    protoc {
      if (osdetector.os == 'osx') {
        // Required for arm64 support on MacOS
        artifact = "com.google.protobuf:protoc:${protocVersion}:osx-x86_64"
      } else {
        artifact = "com.google.protobuf:protoc:${protocVersion}"
      }
    }
  }
}

task(format) {
  dependsOn(':gradle-server:spotlessApply')
  dependsOn(':gradle-plugin:spotlessApply')
  dependsOn(':gradle-plugin-api:spotlessApply')
  dependsOn(':gradle-language-server:spotlessApply')
}
